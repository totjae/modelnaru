<!doctype html>
<html lang="ko" data-theme="light">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ModelNaru · 대화창 디자인 비교</title>
<style>
:root{--bg:#f8f7f4;--surface:#fffefa;--soft:#eeede8;--line:#dedcd6;--text:#282824;--muted:#77766f;--accent:#6550a3;--code:#f0efea;color-scheme:light}
:root[data-theme=dark]{--bg:#20211f;--surface:#272825;--soft:#30312d;--line:#42433d;--text:#eeeee7;--muted:#aaa99e;--accent:#b6a2eb;--code:#1c1d1a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,'Malgun Gothic',sans-serif}button,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}button:hover,button[aria-pressed=true]{background:var(--soft);border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.top{padding:32px 36px 24px;max-width:1800px;margin:auto}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:.16em;font-weight:700}h1{font-size:28px;margin:7px 0}p{margin:10px 0}.intro{color:var(--muted);margin-bottom:22px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.controls label{margin-left:auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;padding:0 36px 36px;max-width:1800px;margin:auto}.option{min-width:0}.caption{margin:0 0 16px;min-height:100px}.caption h2{font-size:20px;margin:0 0 7px;letter-spacing:-.03em}.caption p{font-size:13px;color:var(--muted);margin:0}.badge{font-size:11px;background:var(--soft);padding:4px 8px;border-radius:20px;margin-left:6px;color:var(--accent);vertical-align:middle}.app{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}.appbar{display:flex;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);font-size:13px;align-items:center}.wordmark{font-weight:700;letter-spacing:-.03em}.subtle{color:var(--muted)}.conversation{padding:24px 22px 12px;max-width:928px;margin:auto;min-height:550px}.message{margin-bottom:24px;min-width:0}.who{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11px;margin-bottom:8px}.who strong{color:var(--text);font-size:12px}.user p{margin:0;font-size:14px}.assistant{width:100%}.assistant p,.assistant li{font-size:14px}.assistant h3{font-size:17px;margin:15px 0 8px;letter-spacing:-.02em}.assistant ol{margin:8px 0;padding-left:22px}.assistant li{padding:3px 0}.assistant pre{background:var(--code);padding:13px;border:1px solid var(--line);border-radius:10px;overflow:auto;font:12px/1.7 ui-monospace,monospace}.actions{display:flex;align-items:center;gap:8px;color:var(--muted);margin-top:14px;font-size:11px}.icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;background:transparent;padding:6px;border-radius:8px}.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.actions .count{margin-left:auto}.composer{border:1px solid var(--line);border-radius:16px;margin:8px 20px 20px;padding:14px;background:var(--bg)}.placeholder{font-size:13px;color:var(--muted);margin-bottom:15px}.tools{display:flex;gap:8px;align-items:center;font-size:12px}.tools .model{flex:1}.send{background:var(--text);color:var(--surface);border-radius:50%}.footnote{text-align:center;color:var(--muted);font-size:10px;margin:-10px 15px 16px}.a .user{margin-left:auto;width:fit-content;max-width:94%;background:var(--soft);border-radius:16px;padding:13px 16px}.a .assistant{padding:0}.b .user{width:100%;background:var(--soft);padding:14px 16px;border-radius:12px}.b .assistant{padding:0}.b .assistant .who{border-bottom:1px solid var(--line);padding-bottom:10px}.c .user{width:100%;padding:0 4px}.c .assistant{padding:17px;background:var(--bg);border:1px solid var(--line);border-radius:14px}.grid.single{grid-template-columns:minmax(0,1fr);max-width:1040px}.grid.single .option{display:none}.grid.single .option.chosen{display:block}.grid.mobile{max-width:430px;padding:0 16px 30px}.grid.mobile .conversation{padding:20px 16px 8px}.grid.mobile .composer{margin:8px 12px 16px}.grid.mobile .caption{min-height:0}.notice{max-width:1728px;margin:0 auto 30px;padding:0 36px;color:var(--muted);font-size:12px}@media(max-width:900px){.grid{grid-template-columns:1fr;max-width:880px;padding:0 16px 28px}.top{padding:24px 18px}.caption{min-height:0}.controls label{margin-left:0}.conversation{min-height:0}}
</style>
<header class="top"><div class="eyebrow">MODEL NARU / CONVERSATION STUDY 03</div><h1>여백은 줄이고, 답변은 넓게.</h1><p class="intro">같은 대화를 세 가지 방식으로 비교합니다. AI 본문은 모두 가용 폭 전체를 사용하며, 큰 좌우 들여쓰기를 없앴습니다.</p><div class="controls"><button data-view="all" aria-pressed="true">나란히 비교</button><button data-view="a">A · 본문형</button><button data-view="b">B · 같은 폭</button><button data-view="c">C · 넓은 카드</button><button id="mobile" aria-pressed="false">모바일 폭</button><label>테마 <select id="theme"><option value="light">라이트</option><option value="dark">다크</option></select></label></div></header>
<main class="grid" id="grid"></main>
<p class="notice">디자인 검토용 시안 · 가상 대화 · 실제 모델 호출/저장 없음 · 실제 서비스의 메시지 배치는 선택 후 변경합니다. 복사·재생성 버튼은 배치 예시입니다.</p>
<script>
const icons={copy:'M8 8h12v13H8zM16 8V3H3v13h5',retry:'M20 7v5h-5M19 12a7 7 0 1 0-2 5',template:'M5 3h14v18H5zM8 7h8M8 11h8M8 15h4',plus:'M12 4v16M4 12h16',send:'M12 19V5m-6 6 6-6 6 6'};
const icon=(name,label,cls='')=>`<button class="icon ${cls}" title="${label} · 배치 예시" aria-label="${label}"><svg viewBox="0 0 24 24"><path d="${icons[name]}"/></svg></button>`;
const variants=[['a','A · 가벼운 본문형','질문만 은은한 배경으로 구분하고 AI는 테두리 없이 넓게. ChatGPT에 가까운 읽기 흐름.','추천'],['b','B · 같은 폭 정렬형','질문과 답변의 시작점을 맞추고 역할과 얇은 구분선으로 구별. 좌우 공간을 가장 일관되게 사용.',''],['c','C · 넓은 AI 카드형','현재의 박스 구분감을 남기되 AI 카드를 본문 폭 전체로 확장. 짧은 답변도 같은 폭 유지.','']];
document.querySelector('#grid').innerHTML=variants.map(([key,title,desc,badge])=>`<section class="option ${key}" data-option="${key}"><div class="caption"><h2>${title}${badge?`<span class="badge">${badge}</span>`:''}</h2><p>${desc}</p></div><div class="app"><header class="appbar"><span class="wordmark">MN <span class="subtle">/</span> ModelNaru</span><span class="subtle">배포 검증 순서 · · ·</span></header><div class="conversation"><article class="message user"><div class="who"><strong>나</strong></div><p>배포 후 무엇부터 확인하면 좋을까?<br>설정과 템플릿을 중심으로 짧게 정리해줘.</p></article><article class="message assistant"><div class="who"><strong>ModelNaru</strong><span>선택한 모델</span></div><p>먼저 설정이 저장되는지 확인하고, 실제 요청에 같은 값이 전달되는지 확인하면 됩니다.</p><h3>세 가지만 순서대로 확인하세요</h3><ol><li><strong>설정 유지</strong> — 값을 저장한 뒤 새로고침해도 그대로인지 확인합니다.</li><li><strong>템플릿 적용</strong> — 미리보기에서 변경할 값과 유지할 값을 비교합니다.</li><li><strong>답변 재생성</strong> — 한 자리에서 새 답변을 보고 이전 버전으로 돌아갑니다.</li></ol><pre>최대 출력 토큰  16,384\n미지정 항목     기존 값 유지\n기본값 복원     직접 지정값 삭제</pre><p>모델이 지원하지 않는 설정은 적용 전에 안내합니다.</p><div class="actions">${icon('copy','답변 복사')}${icon('retry','답변 재생성')}<span class="count">‹　1 / 2　›</span></div></article></div><div class="composer"><div class="placeholder">메시지를 입력하세요</div><div class="tools">${icon('plus','첨부')}<span class="model">모델 선택⌄</span>${icon('template','템플릿 선택')}${icon('send','보내기','send')}</div></div><div class="footnote">답변의 중요한 내용은 한 번 더 확인해 주세요.</div></div></section>`).join('');
let current='all',mobile=false;
function render(){const grid=document.querySelector('#grid');grid.classList.toggle('single',current!=='all');grid.classList.toggle('mobile',mobile);document.querySelectorAll('.option').forEach(el=>el.classList.toggle('chosen',el.dataset.option===current));document.querySelectorAll('[data-view]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.view===current)));document.querySelector('#mobile').setAttribute('aria-pressed',String(mobile));}
document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{current=el.dataset.view;if(current==='all')mobile=false;render()});document.querySelector('#mobile').onclick=()=>{mobile=!mobile;if(mobile&&current==='all')current='a';render()};document.querySelector('#theme').onchange=e=>document.documentElement.dataset.theme=e.target.value;
</script></html>
