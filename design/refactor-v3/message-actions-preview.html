<!doctype html>
<html lang="ko" data-theme="dark">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ModelNaru · 대화 버튼 배치 시안</title>
<style>
:root{color-scheme:dark;--bg:#181818;--card:#282828;--line:#454545;--text:#ededed;--muted:#aaa;--accent:#b6a2eb}
:root[data-theme=light]{color-scheme:light;--bg:#faf9f6;--card:#eae9e5;--line:#d8d6d0;--text:#282824;--muted:#74736d;--accent:#6550a3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.75 system-ui,'Malgun Gothic',sans-serif}header{padding:28px 32px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:24px;letter-spacing:-.03em;margin:4px 0}.eyebrow{font-size:11px;color:var(--accent);letter-spacing:.15em}header p{font-size:13px;color:var(--muted);margin:6px 0}select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--text);font:inherit}.comparison{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:24px;padding:0 32px 30px}.label{font-size:12px;color:var(--muted);margin:0 0 10px}.screen{border:1px solid var(--line);border-radius:16px;overflow:hidden}.bar{border-bottom:1px solid var(--line);padding:12px 18px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.bar strong{color:var(--text)}.conversation{padding:20px}.message{margin:0 0 26px;min-width:0}.user{padding:14px 16px;background:var(--card);border-radius:16px;margin-left:auto;width:fit-content;max-width:94%}.who{font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:8px}.who span{font-weight:400;font-size:11px}.message p{margin:0 0 12px}.message p:last-of-type{margin-bottom:0}.assistant{width:100%}.assistant h2{font-size:17px;margin:14px 0 8px}.assistant ul{padding-left:22px;margin:8px 0}.assistant li{margin:5px 0}.copy-row{display:flex;justify-content:flex-end;margin-top:8px}.response-row{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:6px}.icon{width:44px;height:44px;display:inline-grid;place-items:center;padding:0;border:1px solid transparent;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;flex:none}.icon:hover{background:var(--card);border-color:var(--line);color:var(--text)}.icon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.icon:active{transform:scale(.94)}.icon:disabled{opacity:.35;cursor:default;transform:none}.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.count{font-size:12px;min-width:36px;text-align:center;color:var(--muted)}.response-row .regenerate{margin-left:6px;border-color:var(--line)}.mobile .conversation{padding:16px 12px}.mobile .user{padding:12px 14px}.mobile .message{font-size:13px}.mobile h2{font-size:15px}.composer{padding:13px 16px;border:1px solid var(--line);background:var(--card);border-radius:14px;color:var(--muted);font-size:13px;min-height:76px}.legend{padding:0 32px 30px;color:var(--muted);font-size:12px;display:flex;gap:24px;flex-wrap:wrap}.legend strong{color:var(--text)}@media(max-width:900px){header{padding:20px;align-items:flex-start}.comparison{grid-template-columns:1fr;padding:0 16px 20px}.mobile{max-width:390px;width:100%;justify-self:center}.legend{padding:0 20px 20px}h1{font-size:21px}}
</style>
<header><div><div class="eyebrow">MODEL NARU / ACTION PLACEMENT</div><h1>복사는 오른쪽, 답변 탐색은 그 아래.</h1><p>A안 본문 디자인 유지 · 버튼 위치만 변경하는 적용 전 시안</p></div><label>테마 <select id="theme"><option value="dark">다크</option><option value="light">라이트</option></select></label></header>
<main class="comparison"><section class="desktop"><p class="label">데스크톱 · 답변 끝에서 바로 찾는 조작</p><div class="screen" id="desktop"></div></section><section class="mobile"><p class="label">모바일 · 같은 순서와 오른쪽 정렬</p><div class="screen" id="mobile"></div></section></main>
<footer class="legend"><span><strong>① 사용자</strong> 박스 안 우측 하단에 복사</span><span><strong>② AI 첫 줄</strong> 본문 아래 오른쪽에 복사</span><span><strong>③ AI 다음 줄</strong> ‹ 1/1 › 와 재생성을 한 그룹으로 정렬</span><span>가상 대화 · 실제 복사/생성 없음 · 버튼 hover/focus는 확인 가능</span></footer>
<script>
const paths={copy:'M8 8h12v13H8zM16 8V3H3v13h5',previous:'m14 5-7 7 7 7',next:'m10 5 7 7-7 7',retry:'M20 7v5h-5M19 12a7 7 0 1 0-2 5M20 7l-3-3'};
function icon(name,label,extra=''){return `<button type="button" class="icon ${name==='retry'?'regenerate':''}" aria-label="${label}" title="${label} · 시안" ${extra}><svg viewBox="0 0 24 24"><path d="${paths[name]}"/></svg></button>`}
const content=`<div class="bar"><strong>ModelNaru</strong><span>프로젝트 소개 다듬기</span></div><div class="conversation"><article class="message user"><div class="who">나</div><p>시스템 운영 경험을 AI 서비스 개발과 연결하는 소개문을 다듬어 줘.</p><p>핵심 경험은 유지하고, 반복되는 표현을 줄여서 자연스럽게 정리해 줘.</p><div class="copy-row">${icon('copy','사용자 메시지 복사')}</div></article><article class="message assistant"><div class="who">AI<span>선택한 모델</span></div><p>핵심 경험을 앞에 두고 개발과 운영의 연결이 드러나도록 정리했습니다.</p><h2>다듬은 소개문</h2><p>시스템 구축과 운영 경험을 바탕으로 AI 서비스를 개발하고 실행 환경을 구성하는 엔지니어입니다.</p><p>요구사항 정의부터 구현과 검증까지 직접 수행하며, 안정적으로 사용할 수 있는 서비스를 만드는 데 집중합니다.</p><ul><li>반복된 표현을 줄였습니다.</li><li>구현 경험과 운영 경험이 이어지도록 구성했습니다.</li></ul><div class="copy-row">${icon('copy','AI 답변 복사')}</div><div class="response-row">${icon('previous','이전 답변','disabled')}<span class="count">1/1</span>${icon('next','다음 답변','disabled')}${icon('retry','답변 재생성')}</div></article><div class="composer">메시지를 입력하세요</div></div>`;
document.querySelector('#desktop').innerHTML=content;document.querySelector('#mobile').innerHTML=content;
document.querySelector('#theme').onchange=e=>document.documentElement.dataset.theme=e.target.value;
</script></html>
